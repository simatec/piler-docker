# Dependabot: https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  # Base image of the Piler image (build/Dockerfile).
  # The Piler .deb package is built for Ubuntu 26.04 (resolute), so only digest
  # updates (rebuilt 26.04 images with security fixes) are proposed, no 26.10/28.04.
  - package-ecosystem: "docker"
    directory: "/build"
    schedule:
      interval: "weekly"
      day: "monday"
    ignore:
      - dependency-name: "ubuntu"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: "docker"

  # Actions used in .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
